# ~/.config/starship.toml — Catppuccin Mocha

format = """
$directory\
$git_branch\
$git_status\
$nodejs$python$rust$golang$haskell\
$docker_context\
$cmd_duration\
$jobs\
$line_break\
$character"""

add_newline = true
palette = "catppuccin_mocha"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
pink      = "#f5c2e7"
mauve     = "#cba6f7"
red       = "#f38ba8"
maroon    = "#eba0ac"
peach     = "#fab387"
yellow    = "#f9e2af"
green     = "#a6e3a1"
teal      = "#94e2d5"
sky       = "#89dceb"
sapphire  = "#74c7ec"
blue      = "#89b4fa"
lavender  = "#b4befe"
text      = "#cdd6f4"
subtext0  = "#a6adc8"
overlay1  = "#7f849c"
overlay0  = "#6c7086"

[directory]
style = "bold blue"
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"
read_only = " "
read_only_style = "red"

[git_branch]
symbol = " "
style = "mauve"
format = "[$symbol$branch]($style) "

[git_status]
style = "red"
format = "[$all_status$ahead_behind]($style)"
conflicted = "[=${count}](yellow) "
ahead      = "[⇡${count}](teal) "
behind     = "[⇣${count}](teal) "
diverged   = "[⇕${ahead_count}/${behind_count}](yellow) "
untracked  = "[?${count}](overlay1) "
stashed    = "[\\$${count}](sky) "
modified   = "[!${count}](peach) "
staged     = "[+${count}](green) "
renamed    = "[»${count}](blue) "
deleted    = "[✘${count}](red) "

[nodejs]
symbol = " "
style = "green"
format = "[$symbol$version]($style) "
detect_files = ["package.json", ".nvmrc"]
detect_folders = []

[python]
symbol = " "
style = "yellow"
format = "[$symbol$version]($style) "

[rust]
symbol = " "
style = "peach"
format = "[$symbol$version]($style) "

[golang]
symbol = " "
style = "sapphire"
format = "[$symbol$version]($style) "

[haskell]
symbol = " "
style = "mauve"
format = "[$symbol$version]($style) "

[docker_context]
symbol = " "
style = "blue"
format = "[$symbol$context]($style) "
only_with_files = true

[cmd_duration]
min_time = 2000
style = "overlay1"
format = "[󰔟 $duration]($style) "

[jobs]
symbol = "󰜎 "
style = "teal"
format = "[$symbol$number]($style) "

[character]
success_symbol = "[❯](bold green)"
error_symbol   = "[❯](bold red)"
vicmd_symbol   = "[❮](bold lavender)"
